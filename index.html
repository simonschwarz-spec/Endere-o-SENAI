<!DOCTYPE html>
<html lang="pt br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f15f1cff">
    <link rel="apple-touch-icon" href="icons/192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    
    <form id="formConsulta">
        <label for="cep">CEP</label>
        <input id="cep" type="text" inputmode="numeric"
                maxlength="9" placeholder="01001-000" required>
        <label for="cidade">Cidade</label>
        <input id="cidade" type="text"
                placeholder="São Paulo" required>
        <button type="submit">Consultar Endereço</button>
    </form>
    <p id="mensagem" role="status" aria-live="polite"></p>
    <script src="index.js"></script>

</body>
</html>
